<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>

    <link rel="stylesheet" href="./css/style.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="grid-container">

        <!-- NAVBAR -->

        <nav class="navbar">

            <h1>
                <i class="fa-solid fa-laptop"></i>
                Tech Store
            </h1>

        </nav>

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>Categorías</h2>

            <div class="category">
                <p>Laptops</p>
                <span>(12)</span>
            </div>

            <div class="category">
                <p>Smartphones</p>
                <span>(15)</span>
            </div>

            <div class="category">
                <p>Audífonos</p>
                <span>(8)</span>
            </div>

            <div class="category">
                <p>Monitores</p>
                <span>(5)</span>
            </div>

            <div class="category">
                <p>Accesorios</p>
                <span>(10)</span>
            </div>

        </aside>

        <!-- PRODUCTOS -->

        <main class="products-grid">

            <!-- CARD 1 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=1200&auto=format&fit=crop" alt="Laptop">

                <h3>MacBook Pro</h3>

                <p>$1.299.990</p>

                <button>Comprar</button>

            </div>

            <!-- CARD 2 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1200&auto=format&fit=crop" alt="iPhone">

                <h3>iPhone 15</h3>

                <p>$999.990</p>

                <button>Comprar</button>

            </div>

            <!-- CARD 3 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop" alt="Audifonos">

                <h3>AirPods Max</h3>

                <p>$499.990</p>

                <button>Comprar</button>

            </div>

            <!-- CARD 4 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?q=80&w=1200&auto=format&fit=crop" alt="Monitor">

                <h3>Monitor Gamer</h3>

                <p>$249.990</p>

                <button>Comprar</button>

            </div>

            <!-- CARD 5 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?q=80&w=1200&auto=format&fit=crop" alt="Teclado">

                <h3>Teclado RGB</h3>

                <p>$89.990</p>

                <button>Comprar</button>

            </div>

            <!-- CARD 6 -->

            <div class="card">

                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?q=80&w=1200&auto=format&fit=crop" alt="Mouse">

                <h3>Mouse Gamer</h3>

                <p>$49.990</p>

                <button>Comprar</button>

            </div>

        </main>

        <!-- FOOTER -->

        <footer class="footer">

            <p>Tech Store © 2026</p>

        </footer>

    </div>

</body>

</html>
